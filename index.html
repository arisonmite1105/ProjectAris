<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Health Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Tema Alat Rumah Sakit / Medis */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #0284c7;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        h1 {
            color: #0f172a;
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-badge.connected {
            background-color: #dcfce7;
            color: #166534;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-ble {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .btn-ble:hover {
            background-color: #bae6fd;
        }

        .btn-sim {
            background-color: #f1f5f9;
            color: #334155;
        }

        .btn-sim:hover {
            background-color: #e2e8f0;
        }

        .form-section {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 25px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-row label {
            width: 120px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }

        .input-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            font-size: 0.95rem;
            color: #0f172a;
            outline: none;
        }

        .input-row input:focus {
            border-color: #0284c7;
            background-color: #fff;
        }

        .btn-save {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 18px 22px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            line-height: 1.3;
        }

        .btn-save:hover {
            background-color: #059669;
        }

        .table-section {
            margin-bottom: 20px;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f8fafc;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }

        th, td {
            padding: 12px 16px;
            text-align: center;
            font-size: 0.9rem;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr {
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn-csv {
            background-color: #0f172a;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-csv:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>🏥 Hospital Medical Monitor</h1>
                <div class="status-badge" id="statusBadge">Status: Disconnected</div>
            </div>
            <div class="button-group">
                <button id="btnConnect" class="btn btn-ble">🔗 Connect BLE</button>
                <button id="btnSimulasi" class="btn btn-sim">⚡ Simulation Mode</button>
            </div>
        </header>

        <main class="form-section">
            <div class="input-wrapper">
                <div class="input-row">
                    <label for="inputNama">👤 Patient:</label>
                    <input type="text" id="inputNama" placeholder="Enter patient name...">
                </div>
                <div class="input-row">
                    <label for="inputHR">💓 Heart Rate:</label>
                    <input type="text" id="inputHR" placeholder="Waiting data..." readonly>
                </div>
                <div class="input-row">
                    <label for="inputSuhu">🌡️ Body Temp:</label>
                    <input type="text" id="inputSuhu" placeholder="Waiting data..." readonly>
                </div>
            </div>
            <button id="btnSave" class="btn-save">💾<br>Save Record</button>
        </main>

        <section class="table-section">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>Heart Rate (bpm)</th>
                        <th>Temperature (°C)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data log masuk di sini -->
                </tbody>
            </table>
        </section>

        <footer>
            <button id="btnDownload" class="btn btn-csv">📥 Export to CSV</button>
        </footer>
    </div>

    <script>
        /* Logika JavaScript Tetap Berfungsi Sama */
        const btnConnect = document.getElementById('btnConnect');
        const btnSimulasi = document.getElementById('btnSimulasi');
        const btnSave = document.getElementById('btnSave');
        const btnDownload = document.getElementById('btnDownload');
        const statusBadge = document.getElementById('statusBadge');

        const inputNama = document.getElementById('inputNama');
        const inputHR = document.getElementById('inputHR');
        const inputSuhu = document.getElementById('inputSuhu');
        const tableBody = document.getElementById('tableBody');

        let simInterval = null;
        let dataRecords = [];

        btnSimulasi.addEventListener('click', () => {
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
                statusBadge.textContent = "Status: Disconnected";
                statusBadge.classList.remove('connected');
                btnSimulasi.textContent = "⚡ Simulation Mode";
                inputHR.value = "";
                inputSuhu.value = "";
            } else {
                statusBadge.textContent = "Status: Simulation Active";
                statusBadge.classList.add('connected');
                btnSimulasi.textContent = "⏹️ Stop Simulation";
                
                const generateDummyData = () => {
                    const randomHR = Math.floor(Math.random() * (100 - 65 + 1)) + 65;
                    const randomSuhu = (Math.random() * (37.5 - 36.1) + 36.1).toFixed(1);
                    inputHR.value = `${randomHR}`;
                    inputSuhu.value = `${randomSuhu}`;
                };
                generateDummyData();
                simInterval = setInterval(generateDummyData, 2000);
            }
        });

        btnConnect.addEventListener('click', async () => {
            try {
                statusBadge.textContent = "Status: Scanning device...";
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['heart_rate', 'health_thermometer']
                });

                const server = await device.gatt.connect();
                statusBadge.textContent = `Status: Connected (${device.name})_`;
                statusBadge.classList.add('connected');

                device.addEventListener('gattserverdisconnected', () => {
                    statusBadge.textContent = "Status: Disconnected";
                    statusBadge.classList.remove('connected');
                });
            } catch (error) {
                console.error(error);
                statusBadge.textContent = "Status: Connection Failed";
                statusBadge.classList.remove('connected');
            }
        });

        btnSave.addEventListener('click', () => {
            const nama = inputNama.value.trim();
            const hr = inputHR.value.trim();
            const suhu = inputSuhu.value.trim();

            if (!nama) {
                alert("Please enter patient name first!");
                return;
            }
            if (!hr || !suhu) {
                alert("Heart rate and temperature data not available yet!");
                return;
            }

            dataRecords.push({ nama, hr, suhu });

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${nama}</td>
                <td>${hr}</td>
                <td>${suhu}</td>
            `;
            tableBody.appendChild(row);
            inputNama.value = "";
        });

        btnDownload.addEventListener('click', () => {
            if (dataRecords.length === 0) {
                alert("No data available to export!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Patient Name,Heart Rate (bpm),Temperature (C)\n";
            dataRecords.forEach(item => {
                csvContent += `${item.nama},${item.hr},${item.suhu}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "medical_sensor_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
